<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gmp-model — гоферы планировщика Go</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* --- pixel-art palette (mirrors scene/palette.ts PAL) --- */
      :root {
        --bg0: #0b0c13;
        --bg1: #13151f;
        --bg2: #181b29;
        --line: #262a40;
        --line2: #2f344e;
        --tx-hi: #e7eafb;
        --tx-mid: #9aa0c2;
        --tx-dim: #5d6385;
        --teal: #34c9bf;
        --running: #62d27a;
        --runnable: #f2b53d;
        --gc-stw: #ff5e5e;
        --pf: 'Pixelify Sans', sans-serif;
        --mn: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body,
      #app {
        height: 100%;
      }
      body {
        background: var(--bg0);
        overflow: hidden;
        font-family: var(--mn);
        color: var(--tx-mid);
      }
      canvas {
        display: block;
      }
      #app {
        display: flex;
        flex-direction: column;
      }
      .stage {
        flex: 1;
        min-height: 0;
        position: relative;
      }

      /* --- event log panel: the full journal under the world --- */
      .event-log {
        flex: 0 0 auto;
        height: 150px;
        display: flex;
        flex-direction: column;
        background: var(--bg1);
        border-top: 1px solid var(--line);
        font: 11px var(--mn);
      }
      .event-log-head {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-bottom: 1px solid var(--line);
      }
      .event-log-title {
        font-family: var(--pf);
        font-size: 12px;
        color: var(--tx-dim);
        margin-right: 8px;
        cursor: help;
      }
      .event-log-chip {
        font: 10px var(--mn);
        color: var(--tx-dim);
        background: transparent;
        border: 1px solid var(--line2);
        border-radius: 3px;
        padding: 1px 7px;
        cursor: pointer;
      }
      .event-log-chip.active {
        color: var(--chip, var(--tx-hi));
        border-color: var(--chip, var(--line2));
      }
      .event-log-list {
        flex: 1;
        overflow-y: auto;
        padding: 3px 0;
      }
      .event-log-row {
        padding: 1px 12px 1px 10px;
        border-left: 2px solid transparent;
        color: var(--tx-mid);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .event-log-row.future {
        opacity: 0.28;
      }
      .event-log-t {
        display: inline-block;
        min-width: 58px;
        color: var(--tx-dim);
        font-variant-numeric: tabular-nums;
      }
      .event-log-row.cat-sched { border-left-color: var(--running); }
      .event-log-row.cat-wait { border-left-color: #56a7ef; }
      .event-log-row.cat-syscall { border-left-color: #b07ef2; }
      .event-log-row.cat-gc { border-left-color: var(--teal); }
      .event-log-row.cat-proc { border-left-color: #535d8a; }
      .event-log.hide-sched .cat-sched,
      .event-log.hide-wait .cat-wait,
      .event-log.hide-syscall .cat-syscall,
      .event-log.hide-gc .cat-gc,
      .event-log.hide-proc .cat-proc {
        display: none;
      }

      /* --- header chrome: title + GC indicator + heap bar + GC strip --- */
      .chrome-header {
        background: var(--bg2);
        border-bottom: 1px solid var(--line);
      }
      .chrome-head {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 10px 18px 8px;
      }
      .title-wrap {
        display: flex;
        flex-direction: column;
        gap: 1px;
        min-width: 0;
      }
      .chrome-head .title {
        font-family: var(--pf);
        font-size: 20px;
        color: var(--tx-hi);
        letter-spacing: 0.5px;
        white-space: nowrap;
      }
      .chrome-head .title .accent {
        color: var(--running);
      }
      .chrome-head .subtitle {
        font-family: var(--mn);
        font-size: 11px;
        color: var(--tx-mid);
        max-width: 46ch;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .chrome-head .spacer {
        flex: 1;
      }
      .gc-readout {
        font-family: var(--mn);
        font-size: 11px;
        color: var(--tx-dim);
        white-space: nowrap;
      }

      /* --- GC strip: to-scale lane of real GC ranges --- */
      .gc-strip {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 18px 9px;
      }
      .gc-strip-cap {
        font-family: var(--pf);
        font-size: 11px;
        color: var(--tx-dim);
        width: 18px;
      }
      .gc-strip-track {
        position: relative;
        flex: 1;
        height: 9px;
        background: var(--bg0);
        border: 1px solid var(--line2);
        border-radius: 2px;
        overflow: hidden;
      }
      .gc-band {
        position: absolute;
        top: 0;
        bottom: 0;
      }
      .gc-band.mark {
        background: rgba(52, 201, 191, 0.55);
      }
      .gc-band.stw {
        width: 2px;
        background: var(--gc-stw);
        box-shadow: 0 0 4px var(--gc-stw);
      }
      .gc-strip-head {
        position: absolute;
        top: -1px;
        bottom: -1px;
        width: 1px;
        background: var(--tx-hi);
        left: 0;
      }
      .gc {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .gc-dot {
        width: 9px;
        height: 9px;
        border-radius: 1px;
        background: var(--tx-dim);
      }
      .gc-label {
        font-family: var(--pf);
        font-size: 14px;
        color: var(--tx-mid);
        white-space: nowrap;
      }
      .heap {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 200px;
      }
      .heap-cap {
        font-family: var(--pf);
        font-size: 13px;
        color: var(--tx-dim);
      }
      .heap-bar {
        position: relative;
        flex: 1;
        min-width: 120px;
        height: 12px;
        background: var(--bg0);
        border: 1px solid var(--line2);
        border-radius: 2px;
        overflow: hidden;
      }
      .heap-fill {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 0;
        background: var(--tx-dim);
        transition: width 0.18s ease-out;
      }
      /* goal marker = the bar's full extent (heap fill is live/goal); a faint
         amber tick at the right edge labels where GC fires. */
      .heap-goal {
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        width: 2px;
        background: var(--runnable);
        opacity: 0.7;
      }
      .heap-pct {
        font-family: var(--mn);
        font-size: 12px;
        color: var(--tx-mid);
        min-width: 34px;
        text-align: right;
      }

      /* --- floating zone-label pills over the canvas --- */
      .zone-pill {
        position: absolute;
        font-family: var(--pf);
        font-size: 13px;
        line-height: 1.2;
        background: rgba(11, 12, 19, 0.72);
        padding: 2px 7px;
        border-radius: 2px;
        border: 1px solid var(--line);
        white-space: nowrap;
        pointer-events: none;
        z-index: 5;
      }
      .zone-pill.center {
        transform: translateX(-50%);
        text-align: center;
      }
      .zone-sub {
        display: none;
        margin-top: 2px;
        font-family: var(--mn);
        font-size: 11px;
        color: var(--tx-mid);
      }
      .zone-over {
        margin-left: 5px;
        font-family: var(--mn);
        font-size: 11px;
        color: var(--tx-dim);
      }

      /* --- "what's happening" caption + STW banner --- */
      .caption {
        position: absolute;
        left: 50%;
        bottom: 10px;
        transform: translateX(-50%);
        max-width: 72%;
        text-align: center;
        font-family: var(--pf);
        font-size: 14px;
        color: var(--tx-hi);
        background: rgba(11, 12, 19, 0.78);
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 5px 12px;
        pointer-events: none;
        z-index: 6;
      }
      .stw-banner {
        position: absolute;
        left: 50%;
        top: 16px;
        transform: translateX(-50%);
        font-family: var(--pf);
        font-size: 18px;
        color: #fff;
        background: var(--gc-stw);
        padding: 6px 18px;
        border-radius: 3px;
        letter-spacing: 1px;
        white-space: nowrap;
        box-shadow: 0 0 20px rgba(255, 94, 94, 0.6);
        pointer-events: none;
        z-index: 7;
      }

      /* --- legend (color -> state) --- */
      .chrome-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
        padding: 10px 18px;
        background: var(--bg2);
        border-top: 1px solid var(--line);
      }
      .leg-item {
        display: flex;
        align-items: center;
        gap: 7px;
        font-family: var(--pf);
        font-size: 13px;
        color: var(--tx-mid);
      }
      .leg-item .dot {
        width: 11px;
        height: 11px;
        border-radius: 50%;
      }
      /* honesty disclosure: summary line always visible, expands to the full
         assumptions list (built in chrome.ts buildAssumptions) */
      .assumptions {
        width: 100%;
        margin-top: 2px;
        font-family: var(--mn);
        font-size: 11px;
        line-height: 1.5;
        color: var(--tx-mid);
      }
      .assumptions summary {
        cursor: pointer;
        color: var(--runnable);
        user-select: none;
      }
      .assumptions summary:hover {
        color: var(--tx-hi);
      }
      .assume-body {
        margin-top: 8px;
        columns: 2;
        column-gap: 28px;
      }
      @media (max-width: 900px) {
        .assume-body {
          columns: 1;
        }
      }
      .assume-group {
        break-inside: avoid;
        margin-bottom: 8px;
      }
      .assume-group b {
        color: var(--tx-hi);
        font-weight: 600;
      }
      .assume-group ul {
        margin: 4px 0 0;
        padding-left: 16px;
      }
      .assume-group li {
        margin-bottom: 3px;
      }
      .assume-real {
        break-inside: avoid;
        padding: 6px 8px;
        border-left: 2px solid var(--teal);
        background: color-mix(in srgb, var(--teal) 8%, transparent);
        color: var(--tx-mid);
      }

      /* --- language switcher (chrome header) --- */
      .lang-btn {
        font-family: var(--pf);
        font-size: 14px;
        background: var(--bg1);
        color: var(--tx-mid);
        border: 1px solid var(--line2);
        padding: 4px 10px;
        cursor: pointer;
        align-self: center;
      }
      .lang-btn:hover {
        color: var(--tx-hi);
        border-color: var(--teal);
      }

      /* --- control bar (logic in controls.ts; pixel-palette retheme) --- */
      .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 8px;
        padding: 10px 14px;
        background: var(--bg1);
        border-top: 1px solid var(--line);
      }
      .controls button,
      .controls select,
      .controls input {
        font-family: var(--mn);
        font-size: 13px;
        color: var(--tx-hi);
        background: var(--bg2);
        border: 1px solid var(--line2);
        border-radius: 3px;
        padding: 6px 10px;
        min-height: 34px;
        cursor: pointer;
      }
      .controls button:hover,
      .controls select:hover {
        background: #232842;
      }
      .controls button:focus-visible,
      .controls select:focus-visible,
      .controls input:focus-visible {
        outline: 2px solid var(--teal);
        outline-offset: 1px;
      }
      .controls button.active {
        background: rgba(52, 201, 191, 0.14);
        border-color: var(--teal);
        color: var(--teal);
      }
      .controls button.run {
        font-family: var(--pf);
        background: var(--running);
        border-color: var(--running);
        color: var(--bg0);
        letter-spacing: 0.5px;
      }
      .controls button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .controls input[type='range'] {
        flex: 1 1 220px;
        min-width: 180px;
        accent-color: var(--teal);
        padding: 0;
        cursor: pointer;
      }
      .controls input[type='number'] {
        width: 68px;
        cursor: text;
      }
      .controls label {
        display: inline-flex;
        flex-direction: column;
        gap: 2px;
        color: var(--tx-mid);
        font-size: 11px;
      }
      .controls .time {
        color: var(--tx-dim);
        font-size: 12px;
        min-width: 130px;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .controls .sep {
        width: 1px;
        align-self: stretch;
        background: var(--line);
        margin: 0 4px;
      }
      .controls .speeds {
        display: flex;
        gap: 4px;
      }
      .controls button.run.dirty {
        animation: pulse-run 1.1s ease-in-out infinite;
      }
      @keyframes pulse-run {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(98, 210, 122, 0);
        }
        50% {
          box-shadow: 0 0 0 4px rgba(98, 210, 122, 0.35);
        }
      }

      /* --- error states + intro card --- */
      .app-error {
        position: absolute;
        left: 50%;
        top: 16px;
        transform: translateX(-50%);
        max-width: 80%;
        text-align: center;
        font-family: var(--mn);
        font-size: 13px;
        color: #fff;
        background: rgba(255, 94, 94, 0.92);
        border-radius: 3px;
        padding: 8px 14px;
        z-index: 8;
      }
      .fatal {
        margin: auto;
        max-width: 420px;
        text-align: center;
        padding: 28px;
        font-family: var(--mn);
        color: var(--tx-mid);
      }
      .fatal-title {
        font-family: var(--pf);
        font-size: 20px;
        color: var(--gc-stw);
        margin-bottom: 10px;
      }
      .fatal-msg {
        font-size: 13px;
        line-height: 1.5;
        margin-bottom: 16px;
      }
      .fatal button,
      .intro button {
        font-family: var(--pf);
        font-size: 14px;
        color: var(--bg0);
        background: var(--running);
        border: none;
        border-radius: 3px;
        padding: 7px 16px;
        cursor: pointer;
      }
      .intro {
        position: absolute;
        left: 50%;
        top: 42%;
        transform: translate(-50%, -50%);
        max-width: 360px;
        background: rgba(17, 19, 29, 0.96);
        border: 1px solid var(--line2);
        border-radius: 4px;
        padding: 14px 16px;
        z-index: 7;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.55);
      }
      .intro-title {
        font-family: var(--pf);
        font-size: 15px;
        color: var(--tx-hi);
        margin-bottom: 6px;
      }
      .intro-body {
        font-family: var(--mn);
        font-size: 11.5px;
        line-height: 1.5;
        color: var(--tx-mid);
        margin-bottom: 10px;
      }
      .intro-body b {
        color: var(--running);
      }
      .intro-teach {
        color: var(--tx-dim);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
